name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 週次で main をフル実行する（push とは独立に）。
  #
  # 検知したいのは「コードの変化」ではなく **外界の変化** — 上流の advisory データである。
  # 2026-05-30 から 2026-08-12 までの 74 日間、このリポジトリには 1 コミットも無く、
  # CI も一度も走らなかった。その間にコードは 1 行も変わっていないのに `pip-audit` の
  # 検出数は 0 → 22 件（pyjwt / cryptography / starlette を含む＝認証と TLS の面）へ増えていた。
  # advisory は我々のコミットではなく、それ自身の時計で公開されるためである。
  #
  # ここでの検知器は `pip-audit`。`uv.lock` をコミットしていて `uv sync` がそれを尊重するので、
  # 週次実行は「いま固定している版に対する既知脆弱性」を正確に測る。
  #
  # 毎時 00 分は GitHub Actions の高負荷帯で schedule が遅延しやすいと公式に明記されているため、
  # 意図的に 30 分にずらしている。月曜 00:30 UTC = 09:30 JST（週明けの始業時刻）。
  #
  # 🔴 既知の限界: public リポジトリの scheduled workflow は、リポジトリの活動が 60 日間
  # 無いと GitHub により **自動的に無効化される**。上記の空白は 74 日で、しきい値を 14 日
  # 超えている。つまりこの装置は、それが検知しようとしている状態そのものによって止められうる。
  # 「週次が動いている」ことを外側から確かめる仕組みは、この workflow では解決できない
  # （docs/review/2026-08-12.md の後続タスク）。
  schedule:
    - cron: '30 0 * * 1'
  # schedule の初回発火を待たずに動作確認・再実行するための手動トリガー。
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: '意図的に check を失敗させ、失敗通知の経路（notify-failure）を検証する'
        type: boolean
        default: false

# 同一 ref への連続 push で古い実行を打ち切り、CI 時間を無駄にしない。
# 🔴 `github.event_name` を必ず group に含めること。含めないと schedule / workflow_dispatch の
# 実行が push の実行に cancel され、「設定したのに走らない」状態になる。設定ファイルは
# 正しく見えるのに動かないため気づきにくい（nene-origin で実測された罠）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # 失敗通知の経路そのものを検証するための踏み台。通常の実行では常にスキップされる。
      # 「置いた ≠ 動いた」を分けるために、schedule の初回発火を待たずに
      # notify-failure が本当に起票するかを確かめられるようにしてある。
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: |
          echo "simulate_failure=true が指定されたため、意図的に失敗します。"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: pytest (with coverage)
        run: uv run pytest

      - name: coverage gate — domain/use_case layers (90%)
        run: |
          uv run coverage report \
            --include="src/example/*/use_case.py,src/example/*/async_use_case.py,src/example/*/entity.py" \
            --fail-under=90

      - name: mypy
        run: uv run mypy src/

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format
        run: uv run ruff format --check src/ tests/

      - name: pip-audit
        # PYSEC-2025-183: pyjwt weak-key-length — disputed by supplier, no fix version available.
        # Transitive via mcp>=1.0. Re-evaluate when pyjwt releases a fix. (#280)
        run: uv run pip-audit --ignore-vuln PYSEC-2025-183

  integration-db:
    name: Real-DB integration tests
    runs-on: ubuntu-latest
    # 実 PostgreSQL / MySQL に対してリポジトリ層を検証する（#747）。
    # SQLite だけでは露見しなかった lastrowid 由来の採番バグを CI で恒常的に防ぐ。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: nene2
          POSTGRES_DB: nene2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: nene2
          MYSQL_DATABASE: nene2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pnene2"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras

      - name: integration tests (PostgreSQL + MySQL)
        env:
          NENE2_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:nene2@127.0.0.1:5432/nene2_test
          NENE2_TEST_MYSQL_URL: mysql+pymysql://root:nene2@127.0.0.1:3306/nene2_test
        run: uv run pytest tests/integration/ -v --no-cov

  package-build:
    name: Package build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # publish.yml と同じ uv build を PR ごとに走らせ、配布物の壊れを早期検出する（#541）。
      - name: Build sdist + wheel
        run: uv build

      - name: Validate distribution metadata (twine check)
        run: uvx twine check dist/*

      - name: Verify clean install + import (no example/tests leakage)
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/python -c "import nene2; from nene2.http import PaginationResponse; print('import OK')"
          # フレームワーク以外（example/tests）が配布物に混入していないことを保証
          if /tmp/verify/bin/python -c "import example" 2>/dev/null; then
            echo "ERROR: example package leaked into wheel"; exit 1
          fi

  # ===========================================================================
  # 週次実行が失敗したら Issue を起票する
  #
  # なぜ必要か: 通知は届いているが受信箱が飽和している（2026-08-12 実測で未読 1,828 件・
  # うち ci_activity 634 件・最古 3 ヶ月前）。週次の失敗を 1 件足しても山に埋もれるだけなので、
  # **受信箱の外に残る痕跡**を作る。Issue は流れず、次にこのリポを開いた人／AI が必ず見る
  # （repo-status の規約が毎回 `gh issue list --state open` を叩く）。
  #
  # 🔑 対象を schedule に限定するのが設計の芯。PR や push の失敗は、それを起こした本人が
  # その場で見るので起票は不要。**誰も見ていない実行＝ schedule だけ**を拾う。
  # ここを限定しないと Issue がスパム化し、「埋もれる」という元の問題に帰着する。
  #
  # ───────── フリートへ転記するときに差し替える箇所 ─────────
  #   1. `needs:` … その艦の全ジョブ名を列挙する（ここだけが艦ごとに違う）
  #   2. `env.ISSUE_TITLE` … 艦をまたいで一意になるようリポ名を入れてもよい
  #   このジョブ自体は **言語非依存**。検知器（pip-audit / npm audit / composer audit）は
  #   上流の check ジョブ側にあるので、このジョブは差し替え不要。
  # ===========================================================================
  notify-failure:
    name: Open an issue when the scheduled run fails
    # inputs.simulate_failure は、この経路自体を検証するための手動トリガー時のみ真になる。
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [check, integration-db, package-build]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # このジョブは意図的に checkout しない（コードを見る必要がないので速い）。
      # そのぶん `gh` が git remote からリポジトリを特定できないため、明示的に渡す。
      # これが無いと `failed to run git: fatal: not a git repository` で落ちる（実測）。
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          # 完全一致でタイトルを探す。GitHub の検索インデックスは反映が遅れることがあるため、
          # `--search` ではなく取得後の完全一致で判定する（配布時に 19 艦で挙動が揺れないように）。
          # `gh --jq` は `--arg` を受け付けない（あれは jq CLI のフラグ）ので、実体の jq へ渡す。
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"

          body="週次の \`schedule\` 実行が失敗しました。

          - 実行: ${RUN_URL}
          - 発生: $(date -u '+%Y-%m-%d %H:%M UTC')
          - トリガー: \`${{ github.event_name }}\`

          週次実行が検知しているのは **外界の変化**（上流 advisory の追加）であり、
          コードが変わっていなくても赤くなります。まず \`pip-audit\` の出力を確認してください。

          このコメントは失敗のたびに追記されます。**復旧したら手でクローズしてください**
          （自動クローズはしません — 誰も見ないまま閉じるのを防ぐため）。"

          if [ -n "$existing" ]; then
            echo "既存 Issue #${existing} に追記します（重複起票しない）"
            gh issue comment "$existing" --body "$body"
          else
            echo "新規に起票します"
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
