[project]
name = "nene2-python"
version = "1.8.170"
description = "NENE2 Python — minimal API framework following NENE2's design philosophy"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "hideyukiMORI", email = "info.xion.cc@gmail.com"}]
requires-python = ">=3.12"
keywords = ["fastapi", "pydantic", "sqlalchemy", "mcp", "api", "framework", "clean-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # 下限はセキュリティ床でもある。以下 3 つは 2026-08-12 に既知脆弱性が確認された版を
    # 利用者が選べないようにするための引き上げ（uv.lock はこのリポの CI と開発環境しか
    # 守らないため、利用者へ伝播させるには宣言側を上げる必要がある）。
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "python-multipart>=0.0.31",  # PYSEC-2026-3036 / 3037 / 3040
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "structlog>=24.0",
    "mcp>=1.28.1",  # PYSEC-2026-3481 / 3482 / 3483（上限は [tool.uv] の constraint 側で管理）
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/hideyukiMORI/nene2-python"
Repository = "https://github.com/hideyukiMORI/nene2-python"
Documentation = "https://hideyukimori.github.io/nene2-python/"
"Bug Tracker" = "https://github.com/hideyukiMORI/nene2-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.9",
    "pip-audit>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.9",
    "pip-audit>=2.7",
    "psycopg2-binary>=2.9.12",
    "pymysql>=1.1",
]

# ---------------------------------------------------------------------------
# uv — ローカル/CI の解決だけに効く制約
#
# constraint-dependencies は uv.lock の解決に適用されるが、配布物の依存要件
# （[package.metadata] requires-dist）には漏れない。つまり利用者の解決には
# 影響しないので、ライブラリに上限を書く際の副作用（下流の解決衝突）を伴わない。
# ---------------------------------------------------------------------------
[tool.uv]
constraint-dependencies = [
    # ① 何を止めているか: mcp 2.0 系への自動追随（`uv lock --upgrade` での意図しない飛び）。
    # ② 理由: 2.0.0 で `mcp.server.fastmcp` が `mcp.server.mcpserver` へ改名され、
    #    `src/nene2/mcp/server.py` の `from mcp.server.fastmcp import FastMCP` が
    #    ModuleNotFoundError で壊れる（2026-08-12 に実測。MCP 系テスト 4 本が収集エラー）。
    #    現行の advisory 要求は 1.28.1 以上であり、1.x 系で完全に充足している。
    # ③ 外す条件: (a) 上流の mcp 1.x サポートが終了したとき、または
    #    (b) 2.0 固有の機能が必要になったとき。どちらかが満たされたら外して移行する。
    # ④ 参照: 移行の設計ノート（実測の移行規模・方針 4 案と推し・再現手順）は
    #    docs/review/2026-08-12.md §2。解除時はそのまま着手できる状態で凍結してある。
    "mcp<2",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # StaticPool keeps one connection alive by design; dispose() does not fully close it.
    # Fires only during interpreter shutdown on the module-level app singleton.
    "ignore:unclosed database:ResourceWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

# ---------------------------------------------------------------------------
# mypy — strict + unreachable detection
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade — enforce modern Python syntax
    "ANN",  # flake8-annotations — all functions must be typed
    "N",    # pep8-naming
    "B",    # flake8-bugbear — likely bugs and design problems
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit — security anti-patterns
    "T20",  # flake8-print — no print() in production code
    "PTH",  # flake8-use-pathlib — pathlib over os.path
    "RET",  # flake8-return — consistent return patterns
    "TRY",  # tryceratops — try-except patterns
    "PERF", # perflint — performance anti-patterns
    "PL",   # pylint
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "DTZ",  # flake8-datetimez — datetime.now() naive 呼び出し検出
]
ignore = [
    # PHP NENE2 naming convention: Exception/Error suffix (not "Error"-only)
    "N818",
    # Allow long raise messages for clarity
    "TRY003",
    # Allow assert in non-test code when semantically appropriate
    # (tests override this via per-file-ignores)
    # Magic value comparisons are sometimes clearer than named constants
    "PLR2004",
    # Too many arguments/branches — enforce via code review, not hard limit
    "PLR0913",
    "PLR0912",
    # TRY301: Abstract raise to an inner function — too verbose for most cases
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# Tests: relax annotations, allow assert, allow magic values
# DTZ: tests intentionally create naive datetimes to test parse_db_datetime conversion
"tests/**" = ["ANN", "S101", "PLR2004", "PLR0913", "DTZ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nene2"]
